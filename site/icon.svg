<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="WakeBar">
  <defs>
    <linearGradient id="wbBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242220"/>
      <stop offset="100%" stop-color="#171614"/>
    </linearGradient>
    <clipPath id="wbClip"><rect width="512" height="512" rx="96"/></clipPath>
  </defs>
  <g clip-path="url(#wbClip)">
    <rect width="512" height="512" fill="url(#wbBg)"/>
    <rect x="4" y="4" width="504" height="504" rx="92" fill="none" stroke="#624A3A" stroke-opacity="0.45" stroke-width="6"/>
    <!-- Top menu-bar strip motif -->
    <rect x="64" y="68" width="384" height="24" rx="12" fill="#2E2B28"/>
    <circle cx="96" cy="80" r="5" fill="#7A6B5C"/>
    <circle cx="118" cy="80" r="5" fill="#7A6B5C"/>
    <rect x="372" y="74" width="56" height="12" rx="6" fill="#E27A3B"/>
    <!-- Tactile Braun ON-lock toggle switch in center -->
    <rect x="96" y="184" width="320" height="176" rx="88" fill="#121110" stroke="#624A3A" stroke-width="8"/>
    <!-- Left subtle 'sleep' dim line -->
    <circle cx="176" cy="272" r="18" fill="none" stroke="#624A3A" stroke-width="6" opacity="0.65"/>
    <!-- Right glowing amber 'awake' knob -->
    <circle cx="328" cy="272" r="68" fill="#E27A3B"/>
    <circle cx="328" cy="272" r="52" fill="#F4F3DF"/>
    <line x1="328" y1="244" x2="328" y2="300" stroke="#1D1D1B" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>