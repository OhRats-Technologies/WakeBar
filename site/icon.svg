<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="WakeBar">
  <rect width="512" height="512" fill="#634936"/>
  <!-- Bold tactile toggle track in charcoal ink -->
  <rect x="60" y="152" width="392" height="208" rx="104" fill="#1D1D1B"/>
  <!-- Dim left 'off' ring -->
  <circle cx="164" cy="256" r="24" fill="none" stroke="#634936" stroke-width="14"/>
  <!-- Bold warm-ivory 'ON' knob with charcoal vertical power bar -->
  <circle cx="348" cy="256" r="76" fill="#F4F3DF"/>
  <line x1="348" y1="216" x2="348" y2="296" stroke="#1D1D1B" stroke-width="24" stroke-linecap="round"/>
</svg>