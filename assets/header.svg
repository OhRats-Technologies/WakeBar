<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="WakeBar">
  <defs>
    <clipPath id="wbc"><rect width="1280" height="440" rx="16"/></clipPath>
    <pattern id="wbGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#9B8E7F" stroke-width="0.65" opacity="0.26"/>
    </pattern>
    <filter id="wbSh" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1D1D1B" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g clip-path="url(#wbc)">
    <rect width="1280" height="440" fill="#EFECE4"/>
    <rect width="1280" height="440" fill="url(#wbGrid)"/>
    <!-- Subtle macOS menu-bar hairline across top -->
    <rect x="0" y="0" width="1280" height="48" fill="#E5E0D5"/>
    <line x1="0" y1="48" x2="1280" y2="48" stroke="#624A3A" stroke-width="1" opacity="0.45"/>
    <circle cx="1236" cy="24" r="6" fill="#C95B2B"/>
    <rect x="1164" y="20" width="54" height="8" rx="4" fill="#1D1D1B" opacity="0.72"/>
    <!-- Left: Crisp wordmark -->
    <text x="435" y="244" text-anchor="middle" font-family="'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="-3" fill="#1D1D1B">wakebar</text>
    <rect x="280" y="268" width="310" height="4.5" rx="2.25" fill="#624A3A"/>
    <rect x="490" y="268" width="100" height="4.5" rx="2.25" fill="#C95B2B"/>
    <!-- Right: Tactile Braun awake toggle locked ON -->
    <g filter="url(#wbSh)">
      <rect x="793" y="146" width="340" height="148" rx="74" fill="#1D1D1B"/>
      <circle cx="867" cy="220" r="19" fill="none" stroke="#624A3A" stroke-width="4" opacity="0.7"/>
      <circle cx="1059" cy="220" r="57" fill="#E27A3B"/>
      <circle cx="1059" cy="220" r="43" fill="#F4F3DF"/>
      <line x1="1059" y1="197" x2="1059" y2="243" stroke="#1D1D1B" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>
</svg>