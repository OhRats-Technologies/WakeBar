name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Build Universal 2 app
        env:
          WAKEBAR_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0' }}
          WAKEBAR_BUILD: ${{ github.run_number }}
        run: |
          VERSION="${WAKEBAR_VERSION#v}"
          export WAKEBAR_VERSION="$VERSION"
          xcrun swiftc -parse-as-library WakeBar.swift -o /tmp/WakeBarBuilder
          /tmp/WakeBarBuilder --build
          file dist/WakeBar.app/Contents/MacOS/WakeBar
          lipo -archs dist/WakeBar.app/Contents/MacOS/WakeBar | grep -q arm64
          lipo -archs dist/WakeBar.app/Contents/MacOS/WakeBar | grep -q x86_64
          codesign --verify --deep --strict dist/WakeBar.app

      - name: Package CI artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ditto -c -k --sequesterRsrc --keepParent dist/WakeBar.app WakeBar-ci.zip

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: WakeBar
          path: WakeBar-ci.zip

      - name: Import Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
        run: |
          test -n "$APPLE_DEVELOPER_ID_P12"
          test -n "$APPLE_DEVELOPER_ID_PASSWORD"
          KEYCHAIN="$RUNNER_TEMP/wakebar.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$APPLE_DEVELOPER_ID_P12" | base64 -D > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$APPLE_DEVELOPER_ID_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$IDENTITY"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Sign release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          codesign --force --deep --options runtime --timestamp --sign "$SIGNING_IDENTITY" dist/WakeBar.app
          codesign --verify --deep --strict --verbose=2 dist/WakeBar.app
          ditto -c -k --sequesterRsrc --keepParent dist/WakeBar.app "$RUNNER_TEMP/WakeBar-notarize.zip"

      - name: Notarize and staple
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER_ID"
          test -n "$APPLE_API_PRIVATE_KEY"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "$RUNNER_TEMP/WakeBar-notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple dist/WakeBar.app
          xcrun stapler validate dist/WakeBar.app
          spctl --assess --type execute --verbose=2 dist/WakeBar.app

      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --sequesterRsrc --keepParent dist/WakeBar.app "WakeBar-${VERSION}.zip"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "WakeBar-${VERSION}.zip" \
            --title "WakeBar $VERSION" --generate-notes
